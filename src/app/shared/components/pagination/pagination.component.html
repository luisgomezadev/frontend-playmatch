<div class="flex justify-center items-center gap-3 mt-6">
  <button
    class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-700 transition-colors duration-150 hover:border-gray-300 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-gray-200 disabled:hover:bg-white"
    (click)="previous()" [disabled]="currentPage === 0">
    <i class="fa-solid fa-angle-left text-xs"></i>
    <span class="hidden sm:inline">Anterior</span>
  </button>

  <span class="px-2 text-sm font-medium text-gray-500">
    Página <span class="text-gray-900">{{ currentPage + 1 }}</span> de {{ totalPages }}
  </span>

  <button
    class="inline-flex items-center gap-1.5 rounded-lg border border-gray-200 bg-white px-3.5 py-2 text-sm font-medium text-gray-700 transition-colors duration-150 hover:border-gray-300 hover:bg-gray-50 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:border-gray-200 disabled:hover:bg-white"
    (click)="next()" [disabled]="currentPage + 1 >= totalPages">
    <span class="hidden sm:inline">Siguiente</span>
    <i class="fa-solid fa-angle-right text-xs"></i>
  </button>
</div>
